plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'local.native.todo.form.session'
version = '1.0.0'

android {
  namespace "expo.modules.nativetodoformsession"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.core:core-ktx:1.16.0"
}
