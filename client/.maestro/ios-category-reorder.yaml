appId: com.anonymous.client.r6l8abtkq3
---
# Manual helper only:
# NativeManagedList iOS reorder handoff requires keeping the same press alive
# while crossing the drag threshold. Maestro cannot reproduce that reliably yet.
- launchApp:
    appId: com.anonymous.client.r6l8abtkq3
- tapOn:
    text: "client, http://.*:8081"
    optional: true
- extendedWaitUntil:
    visible: Native Managed List
    timeout: 90000
- tapOn: Native Managed List
- extendedWaitUntil:
    visible: Reset Mock
    timeout: 20000
- swipe:
    start: 50%, 25%
    end: 50%, 85%
- swipe:
    start: 50%, 25%
    end: 50%, 85%
- tapOn: Reset Mock
- tapOn: Clear Logs
- assertVisible: Native Managed List
- assertVisible: Work
- assertVisible: Home
- assertVisible: Latest Event
